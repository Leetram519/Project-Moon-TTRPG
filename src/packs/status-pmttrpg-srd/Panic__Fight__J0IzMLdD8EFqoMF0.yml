  description: >-
    <h4>Panic Behavior</h4><p>On their turn, the Character must move adjacent to
    the nearest Target and use their Action(s) to Attack the nearest available
    Target, including allies. If there are multiple Targets the same distance
    away from the Character, the Target is chosen at random.</p><p>When this
    Character takes down a Target, immediately unpanic.</p><hr><h4>Goaded
    Panic</h4><p>The Character can be forced to Attack a specific Target by the
    Provoker.</p>
