name: Self-Staggered
type: status
_id: L6xUlqKPWfaXVcDz
img: systems/projectmoonttrpg/assets/icons/Statuses/Staggered.webp
system:
  name: ''
  description: >-
    <p><strong>Staggered by oneself. Functionally identical to a Stagger, but
    you may choose not to lose SP from this, and you may apply any self-stagger
    effects thanks to this.</strong></p><p>When Staggered, the character is
    unable to act until the end of the Next Round and all their Resistances are
    set to Fatal.</p><p>At the start of the Round after, recover all ST, and
    lose Staggered.</p>
  slug: ''
  homebrewDependencies: []
  subtype: regular
  subsubtype: regular
  homebrew:
    author: ''
    source: Community Rules
  stacks: 1
  stackMax: 1
  priority: 90
  pending: false
  arrival: ''
  shelved: false
  origin: ''
  proc:
    turnStart: false
    startOfRound: false
    endOfRound: false
    actionOrReaction: false
    attackerBurst: false
    onHitWhenActorHas: false
    onHitWhenTargetHas: false
    alwaysActive: false
    skillEffect: false
  customNotes: ''
  easyEffects: |-
    [On Applied]
    set flag "staggerRemain" on item to 2;
    set flag "isStaggered" on self to 1;
    proc SelfStagger on self;
    proc Staggered on self;
    create dialog "Self-Stagger : Deal SP Damage to Self?":
      selfSpDamage as "Deal 5 SP Damage to Self",
      dont as "Don't"
      to self;
    heal 1 light to self;

    [On Dialog Answer selfSpDamage]
    deal 5 sp damage to self;

    [Always Active]
    set resistances to fatal;

    [Start of Round]
    reduce flag "staggerRemain" on item by 1;
    require (item.flag.staggerRemain) <= 0 then lose all "Self-Staggered";

    [On Combat End]
    set flag "skipStaggerBonus" on self to 1;
    lose all "Self-Staggered";

    [On Removed]
    clear flag "isStaggered" on self;
    set st to max;
    require (self.flag.skipStaggerBonus) == 0 then gain 10 tempSt on self;
    clear flag "skipStaggerBonus" on self;
