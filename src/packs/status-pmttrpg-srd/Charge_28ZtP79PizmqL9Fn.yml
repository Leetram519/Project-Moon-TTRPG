system:
  name: ''
  description: >-
    <p>Resource used by certain Skill Effects. There is no limit to Charge
    stacks. </p><p>You may not use skills with Charge Effects with insufficient
    Charge for the entire skill– no partial effects, no selective choices of
    effects if present on the skill. </p><p>The Charge is consumed with skill
    use, regardless of result.</p>
  slug: ''
  stacks: 1
  stackMax: 0
  priority: 0
  pending: false
  arrival: ''
  shelved: false
  origin: ''
  proc:
    turnStart: false
    startOfRound: false
    endOfRound: false
    actionOrReaction: false
    attackerBurst: false
    onHitWhenActorHas: false
    onHitWhenTargetHas: false
    alwaysActive: false
    skillEffect: false
  customNotes: ''
  easyEffects: |-
    [On Combat Start]
    require hasFlag "charge_decision" self == 0 then
      create dialog "Enable Overcharge?":
        yes as "Gain Overcharge from Charge",
        no as "Charge only"
        to self;

    [On Gain]
    require (round) == 1 then
      require hasFlag "charge_decision" self == 0 then
        create dialog "Enable Overcharge?":
          yes as "Gain Overcharge from Charge",
          no as "Charge only"
          to self;

    [On Dialog Answer yes]
    set flag "charge_decision" on self to 1;
    set flag "overcharge_enabled" on self to 1;

    [On Dialog Answer no]
    set flag "charge_decision" on self to 1;
    set flag "overcharge_enabled" on self to 0;

    [On Lose]
    require (self.flag.overcharge_enabled) == 1 then
      require (self.flag.charge_decay) == 0 then
        increase flag "charge_consumed" on self by (-changed.amount);
        require (self.flag.charge_consumed) >= 10 then
          gain ((self.flag.charge_consumed) // 10) Overcharge and
          reduce flag "charge_consumed" on self by (((self.flag.charge_consumed) // 10) * 10);

    [End of Round]
    require (Charge) > 15 then
      set flag "charge_decay" on self to 1;
      lose (3 * (((Charge - 1) // 15))) Charge;
      clear flag "charge_decay" on self;
