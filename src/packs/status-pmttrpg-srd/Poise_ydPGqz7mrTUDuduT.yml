name: Poise
type: status
img: systems/projectmoonttrpg/assets/icons/Statuses/Poise.webp
system:
  name: ''
  description: "<p dir=\"ltr\">On Hit when you have Poise (before Clash Results Effects are applied) roll [[/r 1d10]]. If the D10 rolls Equal to or Lower than your Poise Number, deal a Critical Hit and lose all Poise.\_</p><p dir=\"ltr\">If you have 0 Poise and gain Poise your Critical becomes 1, if your Poise becomes 0 your Critical is 0. If you would gain Poise and Critical in the same action, the Poise is applied first, then the Critical is increased on top of the now present 1 Critical.</p>"
  slug: ''
  stacks: 1
  stackMax: 0
  priority: 7
  pending: false
  arrival: ''
  shelved: false
  origin: ''
  proc:
    turnStart: false
    startOfRound: false
    endOfRound: false
    actionOrReaction: false
    attackerBurst: false
    onHitWhenActorHas: false
    onHitWhenTargetHas: false
    alwaysActive: false
    skillEffect: false
  customNotes: ''
  easyEffects: >-
    [On Hit Before Results]

    require ("Poise Pause") == 0 then 
      proc RollForNoStancePoise;

    [On RollForNoStancePoise]

    roll 1d10[poise] as poiseRoll tagged "critical-check"

    require (poiseRoll) <= (Poise - (4 * "Slasher Stance")) then proc
    AskForCritical

    require (poiseRoll) > (Poise - (4 * "Slasher Stance")) then proc
    FailedCriticalRoll


    [On AskForCritical]

    create dialog "Proc Critical?":
      procCritical as "Do a Critical Hit",
      gainCritical as "Gain 1 Critical and reset Poise to 1"
      to self;

    [On Dialog Answer procCritical]

    proc Critical with (Critical) as amount and lose all Poise on self;


    [On Dialog Answer gainCritical]

    gain 1 Critical and lose (Poise - 1) Poise;


    [On Gain]

    require (changed.before) == 0 then
      require (Critical) == 0 then set Critical to 1;


    [On Lose]

    require (changed.after) == 0 then set Critical to 0;
effects: []
