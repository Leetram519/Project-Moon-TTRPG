  name: ''
  description: >-
    <h4>Panic Behavior</h4><p>On their turn, the Character must use the
    Disengage Action and move as far away as they can from any enemies. If the
    furthest they can move takes them through a hazard, they must move through
    it. If they have any additional Actions, they must use them to Dash and
    increase their movement.</p><p>When this Character ends their turn 9 SQRs
    away from any other Targets (including allies), immediately
    unpanic.</p><hr><h4>Goaded Panic</h4><p>The Character can be forced to move
    in a specific direction by the Provoker. This doesn’t specify complicated
    directions, but simple linear orders like ‘go north’, ‘go to that wall’, or
    ‘go away’.</p>
