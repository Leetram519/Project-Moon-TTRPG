    [On Critical]
    require ("Slasher Stance") >= 1 then
      require (proc.IgnoreDamage) == 0 then deal 1d6[critical] hp critical damage per Critical to target and
      lose all Critical on self and
      gain 2 Critical on self;
    require ("Slayer Stance") >= 1 then
      require (proc.IgnoreDamage) == 0 then deal 2d10kh[critical] hp critical damage per Critical to target and
      lose all Critical on self;
