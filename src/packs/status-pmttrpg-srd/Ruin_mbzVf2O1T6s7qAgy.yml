name: Ruin
type: status
img: systems/projectmoonttrpg/assets/icons/Statuses/Ruin.webp
system:
  name: ''
  description: "<p dir=\"ltr\">On Hit when the Target has Ruin (before Clash Results are applied) roll [[/r 1d10]]. If the D10 rolls Equal to or Lower than the target’s Ruin Number, deal a Devastating Hit and lose all Ruin.\_</p><p dir=\"ltr\">If the target has 0 Ruin and gains Ruin their Devastation becomes 1, if their Ruin becomes 0 their Devastation is 0. If they would gain Ruin and Devastation in the same action, the Ruin is applied first, then the Devastation is increased on top of the now present 1 Devastation.</p><p>\_</p>"
  slug: ''
  stacks: 1
  stackMax: 0
  priority: 7
  pending: false
  arrival: ''
  shelved: false
  origin: ''
  proc:
    turnStart: false
    startOfRound: false
    endOfRound: false
    actionOrReaction: false
    attackerBurst: false
    onHitWhenActorHas: false
    onHitWhenTargetHas: false
    alwaysActive: false
    skillEffect: false
  customNotes: ''
  easyEffects: |-
    [On Being Hit Before Results]
    require ("Ruin Pause") == 0 then 
      proc RollForRuin;

    [On RollForRuin]
    roll 1d10[ruin] as RuinRoll
    require (RuinRoll) <= Ruin then proc AskForDevastation
    require (RuinRoll) > Ruin then
      proc FailedDevastationRoll on attacker targeting self;

    [On AskForDevastation]
    create dialog "Proc Devastation?":
      procDevastation as "Do a Devastating Hit",
      gainDevastation as "Inflict 1 Devastation and reset Ruin to 1"
      to attacker;

    [On Dialog Answer procDevastation]
    proc Devastation and lose all Ruin on self;

    [On Dialog Answer gainDevastation]
    gain 1 Devastation and lose (Ruin - 1) Ruin;

    [On Gain]
    require (changed.before) == 0 then
      require (Devastation) == 0 then set Devastation to 1;
    proc Cursed;

    [On Lose]
    require (changed.after) == 0 then set Devastation to 0;
    proc Cursed;

    [On Removed]
    proc Cursed;
effects: []
