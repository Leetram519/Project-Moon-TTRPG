  description: >-
    <h4>Panic Behavior</h4><p>On their turn, the Character must convert their
    Action(s) into Reactions. They cannot use their movement action. They cannot
    use the Opportunity Attack Reaction.</p><p>When the Character ends their
    third turn under this effect, immediately unpanic.</p><hr><h4>Goaded
    Panic</h4><p>The type (Counter, Block or Evade) of the first N reactions the
    Character uses are selected by the Provoker. N is equal to the Provoker’s
    Rank.</p>
