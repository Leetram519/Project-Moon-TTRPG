  easyEffects: >-
    [On Clash Win With Attack]

    create dialog "Hemomaniac: Transfer Bleed?":
      transferStT as "Transfer from Self to Target",
      transferTtS as "Transfer from Target to Self"
      to self;

    [On Dialog Answer transferStT]

    let $taken = (min(self.status.Bleed, N));

    require ($taken) > 0 then inflict ($taken) Bleed on target and lose ($taken)
