  easyEffects: |-
    [On Being Healed]
    require (self.flag.healFromRegenHP) == 1 then
      create dialog "Detected Heal from Regen HP":
        convertToST as "Convert Heal to Regen ST",
        convertToHP as "Convert Heal to Regen HP"
        on self;

    require (self.flag.healFromRegenST) == 1 then
      create dialog "Detected Heal from Regen ST":
        convertToST as "Convert Heal to Regen ST",
        convertToHP as "Convert Heal to Regen HP"
        on self;

    [On Dialog Answer convertToST]
    convert heal to st;

    [On Dialog Answer convertToHP]
    convert heal to hp;
