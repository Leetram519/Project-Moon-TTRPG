    [On Clash Win]
    require (target.status.Rupture) > (item.flag.ruptureBeforeTarget) then
      inflict (min(N, 3)) Rupture on target;
    require (self.status.Rupture) > (item.flag.ruptureBeforeSelf) then
      inflict (min(N, 3)) Rupture on self;

    [On Clash Lose]
    require (target.status.Rupture) > (item.flag.ruptureBeforeTarget) then
      inflict (min(N, 3)) Rupture on target;
    require (self.status.Rupture) > (item.flag.ruptureBeforeSelf) then
      inflict (min(N, 3)) Rupture on self;
