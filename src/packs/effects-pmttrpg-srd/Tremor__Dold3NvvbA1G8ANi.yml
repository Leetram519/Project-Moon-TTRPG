    [On Clash Win]
    require (target.status.Tremor) > (item.flag.tremorBeforeTarget) then
      inflict (min(N, 3)) Tremor on target;
    require (self.status.Tremor) > (item.flag.tremorBeforeSelf) then
      inflict (min(N, 3)) Tremor on self;

