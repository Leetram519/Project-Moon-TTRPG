    source: Patreon Homebrew
  cost: 2
  stackMax: 3
  appliesTo: weapon
  subtypeWhitelist:
    - melee
    - ranged
  subsubtypeWhitelist:
    - regular
  tags: []
  canPositive: true
  canNegative: false
  procOn: alwaysActive
  procResult: none
  procResultLocked: false
  procChoice: none
  procChoiceLocked: false
  procStat: any
  procDice: any
  procAction: any
  procCondition: ''
  positive: >-
    <p>Gain [N*2] + [Rank Difference between Weapon and Holder] Movement Speed.
    If the rank difference is negative (Weapon rank is higher than Holder rank),
    for every rank difference, your minimum [[/status Bleed]] is [N*2], and you
    lose [N] SP when you first use an action or reaction made each round.</p>
  negative: ''
  macro:
    uuid: ''
  customNotes: ''
  easyEffects: >-
    [On Equip]

    # REPLACE 0 BY RANK DIFFERENCE, and take the absolute value (-2 becomes 2)

    set flag "rank_difference" on item to 0;

    # REPLACE 0 BY 1 IF RANK DIFFERENCE IS NEGATIVE!

    set flag "is_rank_difference_negative" on item to 0;

    proc Luxuria_Attunement;


    [Always Active]

    gain ((N) + (item.flag.rank_difference)) movement;


    [On Luxuria_Attunement]

    require (Bleed) < ((N * 2) * (item.flag.rank_difference)) and
    (item.flag."is_rank_difference_negative") == 1 then 
      set Bleed to ((N * 2) * (item.flag.rank_difference));

    [On Clash Start]

    proc Luxuria_Attunement;


    [On Being Hit]

    proc Luxuria_Attunement;


    [On Reaction]

    require (item.flag."has_used_action_or_reaction") == 0 and
    (item.flag."is_rank_difference_negative") == 1 then
      deal ((N) * (item.flag.rank_difference)) sp damage to self and
      set flag "has_used_action_or_reaction" on item to 1;
    proc Luxuria_Attunement;


    [On Action]

    require (item.flag."has_used_action_or_reaction") == 0 and
    (item.flag."is_rank_difference_negative") == 1 then
      deal ((N) * (item.flag.rank_difference)) sp damage to self and
      set flag "has_used_action_or_reaction" on item to 1;
    proc Luxuria_Attunement;


    [Start of Round]

    set flag "has_used_action_or_reaction" on item to 0;

    proc Luxuria_Attunement;
