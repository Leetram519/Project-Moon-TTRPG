    source: Patreon Homebrew
  cost: 2
  stackMax: 3
  appliesTo: weapon
  subtypeWhitelist:
    - melee
    - ranged
  subsubtypeWhitelist:
    - regular
  tags: []
  canPositive: true
  canNegative: false
  procOn: alwaysActive
  procResult: none
  procResultLocked: false
  procChoice: none
  procChoiceLocked: false
  procStat: any
  procDice: any
  procAction: any
  procCondition: ''
  positive: >-
    <p>On Clash, gain [N] + [Rank Difference between Weapon and Holder]
    [[/status Critical]]. If the rank difference is negative (Weapon rank is
    higher than Holder rank), for every rank difference, your minimum [[/status
    Devastation]] is [N], and you lose [N] SP when you first use an action or
    reaction made each round.</p>
  negative: ''
  macro:
    uuid: ''
  customNotes: ''
  easyEffects: >-
    [On Equip]

    # REPLACE 0 BY RANK DIFFERENCE, and take the absolute value (-2 becomes 2)

    set flag "rank_difference" on item to 0;

    # REPLACE 0 BY 1 IF RANK DIFFERENCE IS NEGATIVE!

    set flag "is_rank_difference_negative" on item to 0;

    proc Superbia_Attunement;


    [On Superbia_Attunement]

    require (Devastation) < ((N) * (item.flag.rank_difference)) and
    (item.flag."is_rank_difference_negative") == 1 then 
      gain ((N) * (item.flag.rank_difference)) Devastation;

    [On Clash Start]

    gain ((N) * item.flag.rank_difference) Critical;

    proc Superbia_Attunement;


    [On Reaction]

    require (item.flag."has_used_action_or_reaction") == 0 and
    (item.flag."is_rank_difference_negative") == 1 then
      deal ((N) * (item.flag.rank_difference)) sp damage to self and
      set flag "has_used_action_or_reaction" on item to 1;
    proc Superbia_Attunement;


    [On Action]

    require (item.flag."has_used_action_or_reaction") == 0 and
    (item.flag."is_rank_difference_negative") == 1 then
      deal ((N) * (item.flag.rank_difference)) sp damage to self and
      set flag "has_used_action_or_reaction" on item to 1;
    proc Superbia_Attunement;


    [Start of Round]

    set flag "has_used_action_or_reaction" on item to 0;

    proc Superbia_Attunement;


    [End of Round]

    proc Superbia_Attunement;
