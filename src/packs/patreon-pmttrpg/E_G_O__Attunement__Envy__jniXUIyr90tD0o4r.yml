  subtypeWhitelist:
    - melee
    - ranged
  subsubtypeWhitelist:
    - regular
  tags: []
  canPositive: true
  canNegative: false
  procOn: alwaysActive
  procResult: none
  procResultLocked: false
  procChoice: none
  procChoiceLocked: false
  procStat: any
  procDice: any
  procAction: any
  procCondition: ''
  positive: >-
    <p>On Use, Gain [N*2] + [Rank Difference between Weapon and Holder]
    [[/status Charge]]. If the rank difference is negative (Weapon rank is
    higher than Holder rank), for every rank difference, you lose [N+1]
    [[/status Charge]] each round, and you lose [N] SP when you first use an
    action or reaction made each round.</p>
  negative: ''
  macro:
    uuid: ''
  customNotes: ''
  easyEffects: >-
    [On Equip]

    # REPLACE 0 BY RANK DIFFERENCE, and take the absolute value (-2 becomes 2)

    set flag "rank_difference" on item to 0;

    # REPLACE 0 BY 1 IF RANK DIFFERENCE IS NEGATIVE!

    set flag "is_rank_difference_negative" on item to 0;


    [On Invidia_Attunement]

    require (Charge) > ((N + 1) * (item.flag.rank_difference)) and
    (item.flag."is_rank_difference_negative") == 1 then 
      lose ((N + 1) * (item.flag.rank_difference)) Charge;

    [On Clash Start]

    gain ((N*2) * item.flag.rank_difference) Charge;


    [On Reaction]

    require (item.flag."has_used_action_or_reaction") == 0 and
    (item.flag."is_rank_difference_negative") == 1 then
      deal ((N) * (item.flag.rank_difference)) sp damage to self and
      set flag "has_used_action_or_reaction" on item to 1;

    [On Action]

    require (item.flag."has_used_action_or_reaction") == 0 and
    (item.flag."is_rank_difference_negative") == 1 then
      deal ((N) * (item.flag.rank_difference)) sp damage to self and
      set flag "has_used_action_or_reaction" on item to 1;

    [Start of Round]

    set flag "has_used_action_or_reaction" on item to 0;


    [End of Round]

    proc Invidia_Attunement;
