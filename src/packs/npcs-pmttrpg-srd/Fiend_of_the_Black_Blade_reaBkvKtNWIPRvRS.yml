      strength: ''
      designIntention: >-
        This is supposed to be an elite enemy, utilising poise for defensive
        purpouses and ruin offensively, with all his skills providing instant
        status, he is ready to react as needed, while maintaning pressure. The
        Fiend should not use both his weapons immidietly, rather, it should be
        unsheathed only against those he deems "worthy". When dual weilding,
        Utilise skills on secondary attacks, eather on second action or off hand
        attack to maximise poise/ruin use before utilising instant effects for
        rapid trigger. Additionally, due to Striker stance, it is possible to
        perform an attack off of a succesfull critical hit with Bulwark Defence,
        providing additional offensive pressure options
      recommendedBehavior: ''
      lore: >-
        A roaming swordsman, a lone fixer of some renown. Where most fixers are
        contracted, The Fiend has ever only chosen himself what contracts to
        complete, appearing with no warning and disapearing just as suddenly,
        his record is immaculate but many suspect there is a deeper malice
        within the swordsman, as such noone works with him willingly due to fear
        and suspicion.
