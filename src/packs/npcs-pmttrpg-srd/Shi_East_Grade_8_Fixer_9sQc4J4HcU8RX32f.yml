    gmBrief:
      complexityGm: 2
      complexityPlayers: 3
      strength: 0.6 / 1.5 (+0.4)
      designIntention: >-
        A simple and easy to use character. Variant of Shi South with less
        direct damage, less statuses, but a higher focus on crit and the ability
        to shoot any target trying to run away once for massive damage. This
        unit is meant to work as a timer, having to be killed before this unit
        builds up 10 poise and large amounts of crit, which allows them to hit
        almost any unit in range with a large HP damage nuke.

        The unit themselves is fairly weak but able to hold their own slightly.
        This unit is especially strong when working by herself, likely against
        only 1 or 2 targets.
      recommendedBehavior: >-
        First Turn, switch to Slayer's Strance.

        Fights like a normal melee unit, while trying to stay relatively safe.

        Focuses on reactionless units. If target is reactionless, use skill.

        Doesn't use skill and instead uses a ranged attack with Precision Bullet
        when Poise is at 10 or Critical is at 5.
      lore: >-
        A lone Shi East grade 8 fixer, going out on solo assassination missions.
        Running targets tend to get shot in the back by a well timed, precise
        arrow.
      notes: ''
