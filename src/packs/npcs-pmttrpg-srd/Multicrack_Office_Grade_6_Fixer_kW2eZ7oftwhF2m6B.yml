    gmBrief:
      complexityGm: 2
      complexityPlayers: 2
      strength: '2'
      designIntention: >-
        A slightly less straightforward offensive unit which focuses on staying
        just outside of most characters attack ranges and attempting to pepper
        them with dual wield attacks to build up charge for their powerful
        multihitting skill. However, they typically do not have many reactions
        after spending them on dual wielding attacks, and once someone manages
        to close the gap with them they have no options to avoid opportunity
        attacks.
      recommendedBehavior: >-
        - Whenever possible, they will attempt to trigger Cavalry Charge, but
        will not risk an Opportunity Attack to do so.

        - Whenever they are attacked, they will respond with a Block defensive
        reaction.

        - This Unit will never take the Disengage action.

        - This Unit does not use Overcharge.
      lore: >-
        A standard fixer from MultiCrack Office, an Office that only accepts
        Fixers who have augmented themselves with prosthetics. These Fixers find
        themselves with the liberty to fight much more recklessly in battle,
        with many of their limbs being able to be reattached or replaced
        entirely when severely damaged in their line of work.
      notes: ''
