    gmBrief:
      complexityGm: 2
      complexityPlayers: 3
      strength: 2/3
      designIntention: >-
        An extraordinarily tanky miniboss-esque unit meant to provide protective
        support to allied units in combat, taking the protect action and
        brunting the worst of the hits its more damage-focused allies would be
        unable to deal with. However, while it is able to shrug off physical
        damage quite easily, it has little to no options to deal with status
        effect damage, and find itself especially weak to sanity damage effects
        due to sanity damage being converted into 2x true HP damage.
      recommendedBehavior: >-
        - When close enough to allies, will convert one Action into a Reaction
        before taking the Protect Action.

        - Will always Tremor Burst if it has the option to.

        - Always uses Block defensive reactions & Always attempts to use the
        free attack from the 2H Defensive property.

        - This unit will never take the Dash action.
      lore: >-
        A large rock-like figure with wide red cracks along its body, all of
        which meet at its center, which has a single yellow eyeball nestled deep
        inside. In battle, red humanoid arms appear from the cracks to attack
        units.
      notes: ''
