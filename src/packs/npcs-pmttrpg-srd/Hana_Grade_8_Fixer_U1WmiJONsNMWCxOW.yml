    gmBrief:
      complexityGm: 3
      complexityPlayers: 2
      strength: 0.7/0.8/1.4
      designIntention: >
        A basic and simple to use NPC which supports allies in critical hitting
        along with being generally very versatile. They mark a Player which will
        be the main target for most of the NPCs that attack freely to attack.
        However as the fight goes on, the Hana fixer gets unluckier and
        unluckier, with significant consequences if they were to get hit.

        Additionally, the Hana fixer's usefulness drops significantly if the
        marked player simply moves to the backline, where they will get hit
        less.

        They may also simply be jumped, or the amount of NPCs within the team
        can be reduced by targeting weaker NPCs to make this unit weaker.
      recommendedBehavior: >-
        Stays near the front line, but not on it.

        On first turn, mark a player with Commander's mark. Preferably one that
        is close but not critical to Player frontline. (Ie melee DPS but not
        tank).

        Afterwards, attack as possible, focusing the Commander's Mark target if
        in range but otherwise attacks freely. Damage type is by default blunt,
        but may be changed as more player resistances are learnt by the Hana
        Grade 8 Fixer,

        Uses Skill when likely to win a clash.

        Uses a reaction based on what fits the situation most.
      lore: >-
        Hana Grade 8 Fixer that really shouldn't be a grade 8 considering their
        skill in command. Still, unfortunate and unlucky events happen commonly
        on their missions...
      notes: ''
