    gmBrief:
      complexityGm: 3
      complexityPlayers: 6
      strength: 0.8~4
      designIntention: >-
        Surprisingly weak! At first glance that is. This boss excels at
        preventing players from starting up their builds if fought directly at
        the start. Additionally, this boss is meant to be teamed up with a bunch
        of rank 2 Middle Little Brothers/Sisters. These other rank 1s serve as
        an opportunity for players to get their builds going, but also if they
        were to be killed, the middle big brother gets permanent strength
        bonuses. If 3 are killed, the Middle Big Brother goes berserk and starts
        attacking everyone instead as well!


        The Middle Big Brother has large amounts of stagger along with very
        above average stagger resistances, making staggering him extremely
        difficult. However, he also takes stagger damage every time he acts and
        also takes self tremor along with negative tremor resistance. This
        encourages a focus on surviving and or winning the clash (without
        necessarily countering) in order to try to get them staggered.


        Essentially, players will have to balance not killing any of the little
        brothers while still fighting them enough to get their builds started to
        be able to directly fight and kill the big brother first. However, they
        can also go for killing so many little brothers that the Middle Big
        Brother goes insane! Alternatively, they can survive and fight back
        slowly for so long that the Middle Big Brother staggers themself,
        providing a opportunity to easily kill him.
      recommendedBehavior: >-
        Every turn, attack. Dualwields on attack. If attacked? Counter!

        Uses 'Watch Your Back!' If target has no reaction and is within range.

        Uses 'Enough Games!' If it looks like Middle Big Brother has a chance of
        losing the clash.

        Uses 'Promised Suffering' on the player that kills a middle little
        brother.

        Uses 'COMPLETE AND TOTAL EXTERMINATION!!!!!!' after reaching half hp or
        being unstaggered. Only once per combat.
      lore: >-
        A quintessential example of what a middle big brother should be to all
        amongst the middle. Someone who cares deeply about each and every member
        within their family, all the while fighting with pure direct force and
        style. Though with how much care this big brother gives to his many
        brothers and sisters, what will happen if too many were to die...?
      notes: >-
        Has 4-5 Rank 1 Middle Little Members along side him.

        Meant for R2 4-5 players. If less players than that, wait till R2 Level
        2/3 and such.

        Suitable as R3 fodder to show growth once your players are R3.

        Has a homebrew AoE skill.
