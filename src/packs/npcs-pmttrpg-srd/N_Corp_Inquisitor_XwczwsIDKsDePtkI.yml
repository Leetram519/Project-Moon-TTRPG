    gmBrief:
      complexityGm: 1
      complexityPlayers: 2
      strength: '2'
      designIntention: >-
        A bleed-infliction focused fodder enemy intended to be thrown in medium
        sized groups at a Rank 3 party, swarming their enemies with high status
        infliction to force them to take the time to deal with the status.
        However, losing clashes inflicts them with a status that they notably
        cannot clear with the reduce status action, and they do not have a
        reliable way to recover ST without taking a huge risk with a weak evade
        dice.
      recommendedBehavior: >-
        - Attempts to stick in clusters of 2-3 allies and focus on one target at
        a time

        - Before using any skills, will attempt to use its Applied Tool to
        inflict large amounts of Hemorrhage

        - If there are any Prosthetic users amongst their enemies, they will
        always prioritize them first, at all costs
      lore: >-
        A member from a Subdivision of Nagel und Hammer that aims to wipe out
        prosthetic users due to their perceived impurities and distance from N
        Corp.'s ideal image of humanity.
