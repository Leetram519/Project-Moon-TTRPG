    gmBrief:
      complexityGm: 1.5
      complexityPlayers: 3
      strength: 0.5/0.8/1.2
      designIntention: >-
        A basic and simple to use NPC which focuses on protecting one specific
        ally very well. This unit itself is not that good at protecting itself
        and can be targeted down easily, along with having alot less in
        reactions. However, if allowed to protect their VIP, the VIP can become
        an absolute tank for a 1-2 turns, nearly impervious to all damage
        without needing to respond.

        Notably, this NPC becomes near useless to the VIP when out of light,
        meaning they can be outlasted as well.

        Due to having 1 in Fortitude, a 3 Fortitude player can grapple and
        simply haul this NPC away from the VIP as well.
      recommendedBehavior: >-
        Has one designated VIP ally.

        On VIP ally getting hit by an attack for the first time, uses a reaction
        to apply Mark for Tending on the VIP.

        Tries to move closer to the VIP.

        Always protects actions when next to the VIP.
      lore: >-
        Basic Zwei south Grade 8 Fixer, recently trained. Unintrusively
        protecting select VIP targets from potential attackers, though still
        recently trained and lacking in many areas...
      notes: ''
